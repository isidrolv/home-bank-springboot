spring.application.name=home-bank-rest-api
spring.docker.compose.enabled=false


spring.datasource.url=jdbc:firebirdsql://127.0.0.1:3050/C:/Firebird Databases/ESCOLAR.FDB?lc_ctype=UTF8
spring.datasource.username=sysdba
spring.datasource.password=masterkey
spring.datasource.driver-class-name=org.firebirdsql.jdbc.FBDriver
spring.data.jdbc.repositories.enabled=true
#spring.jpa.database-platform=com.homebank.api.config.FirebirdDialect
#spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.maximum-pool-size=10 

# OpenAI calls stay on the Spring server. Override these with environment variables in production.
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.text-model=${OPENAI_TEXT_MODEL:gpt-5.6-sol}
openai.image-model=${OPENAI_IMAGE_MODEL:gpt-5.6}
openai.image-quality=${OPENAI_IMAGE_QUALITY:medium}
openai.image-size=${OPENAI_IMAGE_SIZE:1536x1024}
